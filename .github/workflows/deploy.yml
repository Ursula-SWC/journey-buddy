# Deploys Journey Buddy to Cloudflare on every push to main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template plus D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# See docs/deploying.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check setup
        run: |
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.jsonc; then
            echo "::error::Put your D1 database_id into wrangler.jsonc first (see docs/deploying.md)."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see docs/deploying.md)."
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply journey-buddy --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
